# MasterSim-wide qmake settings, read automatically by all sub-projects
# (counterpart to the MasterSim-specific settings in the top-level CMakeLists.txt).

# macOS: build universal binaries (Apple Silicon + Intel), so that FMUs of both
# architectures can be used (x86_64 FMUs on Apple Silicon via 'arch -x86_64 mastersim').
QMAKE_APPLE_DEVICE_ARCHS = x86_64 arm64

# no fused multiply-add contraction (default of clang on arm64), so that results are
# identical on all architectures and match the regression test references
QMAKE_CFLAGS   += -ffp-contract=off
QMAKE_CXXFLAGS += -ffp-contract=off
