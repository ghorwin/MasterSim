name: Ubuntu 26.04/Qt6 build

on:
  # run nightly at 2:00 am
#  schedule:
#    - cron: "0 2 * * *"
  # allow to be triggered on github webpage manually
  workflow_dispatch:
  # run whenever someone pushes data
  # as we do not have much development, this will not cause much traffic/build times
#  push:
#    branches: [ "master" ]
#  pull_request:
#    branches: [ "master" ]

jobs:
  build:

    # build inside an Ubuntu 26.04 container, so that we do not depend on the availability
    # of a GitHub hosted 26.04 runner image
    runs-on: ubuntu-latest
    container: ubuntu:26.04

    steps:
    - uses: actions/checkout@v4

    # Qt6 from the distribution, 7za is needed to pack the test FMUs,
    # colorama is used by the test suite runner
    - name: Install dependencies
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y build-essential cmake zlib1g-dev 7zip python3 python3-colorama \
          qt6-base-dev qt6-svg-dev libgl-dev

    - name: Build
      run: build/build.sh release skip-test

    - name: Test
      run: build/run_tests.sh
