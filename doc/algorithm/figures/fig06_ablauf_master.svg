<text x="400" y="713.64" font-size="12" text-anchor="middle" fill="#1a1a1a" font-weight="bold"><tspan>Schritt akzeptieren:</tspan></text>
<text x="400" y="729" font-size="12" text-anchor="middle" fill="#1a1a1a"><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.04">realyt</tspan><tspan> ← </tspan><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.04">realytNext</tspan><tspan>, </tspan><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.04">realDerivyt</tspan><tspan> ← </tspan><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.04">realDerivytNext</tspan></text>
<path d="M400,744 L400,770" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="310" y="772" width="180" height="38" rx="19" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="1.2"/>
<text x="400" y="795.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>Ende Schritt</tspan></text>
