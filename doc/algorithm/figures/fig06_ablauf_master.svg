<path d="M400,488 L400,513" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="190" y="515" width="420" height="54" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="400" y="538.36" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">fmi2GetReal</tspan><tspan> + </tspan><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">fmi2GetRealOutputDerivatives</tspan></text>
<text x="400" y="555" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>→ </tspan><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">realytNext</tspan><tspan>, </tspan><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">realDerivytNext</tspan></text>
<path d="M400,569 L400,592" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<polygon points="400,593 515,625 400,657 285,625" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" fill-opacity="1"/>
<text x="400" y="629.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>Iteration nötig ?</tspan></text>
<path d="M515,625 L598,625" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="524" y="617" font-size="12" text-anchor="start" fill="#6b6b6b"><tspan>ja</tspan></text>
