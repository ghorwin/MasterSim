<text x="692.5" y="621.64" font-size="12" text-anchor="middle" fill="#1a1a1a"><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.04">fmi2SetFMUstate</tspan></text>
<text x="692.5" y="637" font-size="12" text-anchor="middle" fill="#1a1a1a"><tspan>Eingänge und Ableitungen</tspan></text>
<text x="692.5" y="652.36" font-size="12" text-anchor="middle" fill="#1a1a1a"><tspan>neu setzen</tspan></text>
<path d="M692,590 L692,205 L517,205" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
