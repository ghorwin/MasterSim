<text x="400" y="38.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>Start: Schritt t</tspan><tspan font-size="9.36" dy="3.64">n</tspan><tspan dy="-3.64"> → t</tspan><tspan font-size="9.36" dy="3.64">n+1</tspan></text>
<path d="M400,53 L400,72" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<polygon points="400,72 530,110 400,148 270,110" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" fill-opacity="1"/>
<text x="400" y="106.36" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>Verbindung mit</tspan></text>
<text x="400" y="123" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>m</tspan><tspan font-size="9.36" dy="3.64">conn</tspan><tspan dy="-3.64"> ≥ 1 ?</tspan></text>
<path d="M270,110 L105,110 L105,268" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="260" y="102" font-size="12" text-anchor="end" fill="#6b6b6b"><tspan>nein</tspan></text>
