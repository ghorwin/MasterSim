<text x="105" y="296.36" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>nur </tspan><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">fmi2SetReal</tspan></text>
<text x="105" y="313" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>(Zero-Order-Hold)</tspan></text>
<path d="M400,148 L400,172" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="408" y="165" font-size="12" text-anchor="start" fill="#6b6b6b"><tspan>ja</tspan></text>
<polygon points="400,173 515,205 400,237 285,205" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2" fill-opacity="1"/>
<text x="400" y="209.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>Algorithmus ?</tspan></text>
<path d="M400,237 L400,250 L310,250 L310,268" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<path d="M400,250 L540,250 L540,268" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="210" y="270" width="200" height="76" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="310" y="289.28" font-size="12" text-anchor="middle" fill="#1a1a1a"><tspan>Gauss-Jacobi oder</tspan></text>
<text x="310" y="304.64" font-size="12" text-anchor="middle" fill="#1a1a1a"><tspan>Erzeuger noch nicht gerechnet:</tspan></text>
<text x="310" y="320" font-size="12" text-anchor="middle" fill="#1a1a1a"><tspan>u = c</tspan><tspan font-size="8.64" dy="3.36">0</tspan><tspan dy="-3.36"> + c</tspan><tspan font-size="8.64" dy="3.36">1</tspan><tspan dy="-3.36">·y(t</tspan><tspan font-size="8.64" dy="3.36">n</tspan><tspan dy="-3.36">)</tspan></text>
<text x="310" y="335.36" font-size="12" text-anchor="middle" fill="#1f5fa8"><tspan>du/dt = c</tspan><tspan font-size="8.64" dy="3.36">1</tspan><tspan dy="-3.36">·dy/dt(t</tspan><tspan font-size="8.64" dy="3.36">n</tspan><tspan dy="-3.36">)</tspan></text>
<rect x="425" y="270" width="235" height="76" rx="4" fill="#e5edf7" stroke="#1f5fa8" stroke-width="1.2"/>
<text x="542.5" y="289.28" font-size="12" text-anchor="middle" fill="#1a1a1a"><tspan>Gauss-Seidel,</tspan></text>
<text x="542.5" y="304.64" font-size="12" text-anchor="middle" fill="#1a1a1a"><tspan>Erzeuger schon gerechnet:</tspan></text>
<text x="542.5" y="320" font-size="12" text-anchor="middle" fill="#1a1a1a"><tspan>u = c</tspan><tspan font-size="8.64" dy="3.36">0</tspan><tspan dy="-3.36"> + c</tspan><tspan font-size="8.64" dy="3.36">1</tspan><tspan dy="-3.36">·y(t</tspan><tspan font-size="8.64" dy="3.36">n</tspan><tspan dy="-3.36">)</tspan></text>
<text x="542.5" y="335.36" font-size="12" text-anchor="middle" fill="#1f5fa8"><tspan>du/dt = c</tspan><tspan font-size="8.64" dy="3.36">1</tspan><tspan dy="-3.36">·(y(t</tspan><tspan font-size="8.64" dy="3.36">n+1</tspan><tspan dy="-3.36">) − y(t</tspan><tspan font-size="8.64" dy="3.36">n</tspan><tspan dy="-3.36">))/h</tspan></text>
<path d="M310,346 L310,378" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<path d="M540,346 L540,378" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="230" y="380" width="450" height="38" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="455" y="403.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">fmi2SetReal</tspan><tspan> + </tspan><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">fmi2SetRealInputDerivatives</tspan></text>
<path d="M400,418 L400,448" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
