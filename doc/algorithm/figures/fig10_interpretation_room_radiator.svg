<text x="391" y="241" font-size="13" text-anchor="end" fill="#1a1a1a" font-style="italic"><tspan>t</tspan></text>
<text x="40" y="58" font-size="13" text-anchor="start" fill="#1a1a1a" font-style="italic"><tspan>Q</tspan></text>
<text x="412" y="18" font-size="14" text-anchor="start" fill="#1a1a1a" font-weight="bold"><tspan>(b) Radiator: Eingang T</tspan><tspan font-size="10.08" dy="3.92">room</tspan></text>
<text x="412" y="36" font-size="12" text-anchor="start" fill="#6b6b6b"><tspan>gesetzter Wert gilt als T(t</tspan><tspan font-size="8.64" dy="3.36">n</tspan><tspan dy="-3.36">), lineare Extrapolation bis t</tspan><tspan font-size="8.64" dy="3.36">n+1</tspan></text>
