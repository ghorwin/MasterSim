<text x="730.83" y="243" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic"><tspan>t</tspan><tspan font-size="9.36" dy="3.64">n+1</tspan></text>
<path d="M730.83,225 L730.83,229" fill="none" stroke="#1a1a1a" stroke-width="1" stroke-linejoin="round"/>
