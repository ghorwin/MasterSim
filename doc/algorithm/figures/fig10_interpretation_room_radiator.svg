<text x="590.9" y="135.5" font-size="12" text-anchor="end" fill="#1a1a1a"><tspan>T(t</tspan><tspan font-size="8.64" dy="3.36">n</tspan><tspan dy="-3.36">), gesetzt</tspan></text>
<text x="724.83" y="90.75" font-size="12" text-anchor="end" fill="#1f5fa8"><tspan>T</tspan><tspan font-size="8.64" dy="3.36">est</tspan><tspan dy="-3.36">(t</tspan><tspan font-size="8.64" dy="3.36">n+1</tspan><tspan dy="-3.36">)</tspan></text>
<text x="724.83" y="159.5" font-size="12" text-anchor="end" fill="#6b6b6b"><tspan>ohne Interpolation</tspan></text>
<text x="606.9" y="215" font-size="12" text-anchor="start" fill="#1a1a1a"><tspan>Q</tspan><tspan font-size="8.64" dy="3.36">n+1</tspan><tspan dy="-3.36"> = K</tspan><tspan font-size="8.64" dy="3.36">p</tspan><tspan dy="-3.36">·(T</tspan><tspan font-size="8.64" dy="3.36">set</tspan><tspan dy="-3.36"> − T</tspan><tspan font-size="8.64" dy="3.36">est</tspan><tspan dy="-3.36">)</tspan></text>
