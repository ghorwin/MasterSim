<text x="206.9" y="159.5" font-size="12" text-anchor="start" fill="#1a1a1a"><tspan>Q(t</tspan><tspan font-size="8.64" dy="3.36">n</tspan><tspan dy="-3.36">), aus Vorschritt gemerkt</tspan></text>
<text x="326.83" y="81.34" font-size="12" text-anchor="end" fill="#1a1a1a"><tspan>vor </tspan><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.04">fmi2DoStep</tspan><tspan> gesetzt</tspan></text>
<text x="192.9" y="95.34" font-size="12" text-anchor="end" fill="#6b6b6b"><tspan>ohne Interpolation</tspan></text>
<text x="66.98" y="243" font-size="13" text-anchor="middle" fill="#1a1a1a" font-style="italic"><tspan>t</tspan><tspan font-size="9.36" dy="3.64">n−1</tspan></text>
