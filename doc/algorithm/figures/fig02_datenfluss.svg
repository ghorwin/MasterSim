<text x="208" y="133" font-size="13" text-anchor="start" fill="#1f5fa8"><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">fmi2GetRealOutputDerivatives</tspan><tspan>(y, k)</tspan></text>
