<path d="M420,310 L420,403" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<path d="M465,310 L465,403" fill="none" stroke="#1f5fa8" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="6,4" marker-end="url(#arr-accent)"/>
<text x="405" y="355" font-size="13" text-anchor="end" fill="#1a1a1a"><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">fmi2SetReal</tspan><tspan>(u)</tspan></text>
<text x="405" y="375" font-size="13" text-anchor="end" fill="#1f5fa8"><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">fmi2SetRealInputDerivatives</tspan><tspan>(u, k)</tspan></text>
<path d="M30,432 L70,432" fill="none" stroke="#1a1a1a" stroke-width="1.5" stroke-linejoin="round"/>
<text x="78" y="436" font-size="12" text-anchor="start" fill="#1a1a1a"><tspan>Wert (Ordnung 0)</tspan></text>
