<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="86mm" viewBox="0 0 800 430" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<title>FMU als Verbraucher von Eingangsableitungen</title>
<defs><marker id="arr-ink" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1a1a1a"/></marker><marker id="arrs-ink" viewBox="0 0 10 8" refX="0.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1a1a1a"/></marker><marker id="arr-gray" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6b6b6b"/></marker><marker id="arrs-gray" viewBox="0 0 10 8" refX="0.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#6b6b6b"/></marker><marker id="arr-accent" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f5fa8"/></marker><marker id="arrs-accent" viewBox="0 0 10 8" refX="0.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1f5fa8"/></marker><marker id="arr-orange" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c0601a"/></marker><marker id="arrs-orange" viewBox="0 0 10 8" refX="0.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#c0601a"/></marker><marker id="arr-red" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b2282e"/></marker><marker id="arrs-red" viewBox="0 0 10 8" refX="0.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#b2282e"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="15" y="10" width="375" height="410" rx="6" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="1"/>
<text x="29" y="34" font-size="14" text-anchor="start" fill="#1a1a1a" font-weight="bold"><tspan>Variante A: Master liefert Ableitung</tspan></text>
<rect x="410" y="10" width="375" height="410" rx="6" fill="#f4f4f4" stroke="#6b6b6b" stroke-width="1"/>
<text x="424" y="34" font-size="14" text-anchor="start" fill="#1a1a1a" font-weight="bold"><tspan>Variante B: FMU-interne Historie</tspan></text>
<rect x="50" y="55" width="305" height="34" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="202.5" y="76.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">fmi2SetReal</tspan><tspan>(u(t</tspan><tspan font-size="9.36" dy="3.64">n</tspan><tspan dy="-3.64">))</tspan></text>
<rect x="50" y="99" width="305" height="34" rx="4" fill="#e5edf7" stroke="#1f5fa8" stroke-width="1.2"/>
<text x="202.5" y="120.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">fmi2SetRealInputDerivatives</tspan><tspan>(du/dt)</tspan></text>
<path d="M202,133 L202,163" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="50" y="165" width="305" height="50" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="202.5" y="186.36" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>Eingangspolynom</tspan></text>
<text x="202.5" y="203" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>u(t) = u(t</tspan><tspan font-size="9.36" dy="3.64">n</tspan><tspan dy="-3.64">) + du/dt·(t − t</tspan><tspan font-size="9.36" dy="3.64">n</tspan><tspan dy="-3.64">)</tspan></text>
<path d="M202,215 L202,245" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="50" y="247" width="305" height="34" rx="4" fill="#fbeadc" stroke="#c0601a" stroke-width="1.2"/>
<text x="202.5" y="268.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>integrieren t</tspan><tspan font-size="9.36" dy="3.64">n</tspan><tspan dy="-3.64"> → t</tspan><tspan font-size="9.36" dy="3.64">n+1</tspan></text>
<text x="202" y="330" font-size="12" text-anchor="middle" fill="#1f5fa8"><tspan>Zeitbezug eindeutig:</tspan></text>
<text x="202" y="345.36" font-size="12" text-anchor="middle" fill="#1f5fa8"><tspan>Werte und Ableitungen gelten</tspan></text>
<text x="202" y="360.72" font-size="12" text-anchor="middle" fill="#1f5fa8"><tspan>am Schrittanfang t</tspan><tspan font-size="8.64" dy="3.36">n</tspan><tspan dy="-3.36"> (FMI 2.0.5, 4.2.1)</tspan></text>
<rect x="445" y="55" width="305" height="34" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="597.5" y="76.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.96">fmi2SetReal</tspan><tspan>(u)</tspan></text>
<path d="M597,89 L597,113" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="445" y="115" width="305" height="34" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="597.5" y="136.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>Historie (t</tspan><tspan font-size="9.36" dy="3.64">prev</tspan><tspan dy="-3.64">, u</tspan><tspan font-size="9.36" dy="3.64">prev</tspan><tspan dy="-3.64">)</tspan></text>
<path d="M597,149 L597,173" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="445" y="175" width="305" height="50" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="597.5" y="196.36" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>du/dt ≈ (u − u</tspan><tspan font-size="9.36" dy="3.64">prev</tspan><tspan dy="-3.64">) / (t − t</tspan><tspan font-size="9.36" dy="3.64">prev</tspan><tspan dy="-3.64">)</tspan></text>
<text x="597.5" y="213" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>oder Rampe u</tspan><tspan font-size="9.36" dy="3.64">prev</tspan><tspan dy="-3.64"> → u</tspan></text>
<path d="M597,225 L597,249" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="445" y="251" width="305" height="34" rx="4" fill="#fbeadc" stroke="#c0601a" stroke-width="1.2"/>
<text x="597.5" y="272.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>integrieren t</tspan><tspan font-size="9.36" dy="3.64">n</tspan><tspan dy="-3.64"> → t</tspan><tspan font-size="9.36" dy="3.64">n+1</tspan></text>
<path d="M597,285 L597,309" fill="none" stroke="#1a1a1a" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<rect x="445" y="311" width="305" height="34" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.2"/>
<text x="597.5" y="332.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>Historie aktualisieren (im FMUstate!)</tspan></text>
<path d="M750,328 L770,328 L770,132 L752,132" fill="none" stroke="#6b6b6b" stroke-width="1.2" stroke-linejoin="round" stroke-dasharray="5,3" marker-end="url(#arr-gray)"/>
<text x="597" y="375" font-size="12" text-anchor="middle" fill="#b2282e"><tspan>Zeitbezug muss geraten werden:</tspan></text>
<text x="597" y="390.36" font-size="12" text-anchor="middle" fill="#b2282e"><tspan>Schrittanfang oder -ende?</tspan></text>
</svg>
