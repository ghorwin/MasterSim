<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="160mm" height="52mm" viewBox="0 0 800 260" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
<title>Kopplung der Test-FMUs Room und Radiator</title>
<defs><marker id="arr-ink" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1a1a1a"/></marker><marker id="arrs-ink" viewBox="0 0 10 8" refX="0.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1a1a1a"/></marker><marker id="arr-gray" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#6b6b6b"/></marker><marker id="arrs-gray" viewBox="0 0 10 8" refX="0.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#6b6b6b"/></marker><marker id="arr-accent" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#1f5fa8"/></marker><marker id="arrs-accent" viewBox="0 0 10 8" refX="0.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#1f5fa8"/></marker><marker id="arr-orange" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c0601a"/></marker><marker id="arrs-orange" viewBox="0 0 10 8" refX="0.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#c0601a"/></marker><marker id="arr-red" viewBox="0 0 10 8" refX="9.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#b2282e"/></marker><marker id="arrs-red" viewBox="0 0 10 8" refX="0.5" refY="4" markerWidth="10" markerHeight="8" markerUnits="userSpaceOnUse" orient="auto"><path d="M10,0 L0,4 L10,8 z" fill="#b2282e"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<rect x="15" y="40" width="310" height="140" rx="4" fill="#e5edf7" stroke="#1f5fa8" stroke-width="1.2"/>
<text x="170" y="81.4" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold"><tspan>Radiator</tspan></text>
<text x="170" y="98.04" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>P-Regler mit Stufen-Thermostat</tspan></text>
<text x="170" y="114.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>Q = clamp(K</tspan><tspan font-size="9.36" dy="3.64">p</tspan><tspan dy="-3.64">·(T</tspan><tspan font-size="9.36" dy="3.64">set</tspan><tspan dy="-3.64"> − T</tspan><tspan font-size="9.36" dy="3.64">est</tspan><tspan dy="-3.64">), 0, Q</tspan><tspan font-size="9.36" dy="3.64">max</tspan><tspan dy="-3.64">)</tspan></text>
<text x="170" y="131.32" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>K</tspan><tspan font-size="9.36" dy="3.64">p</tspan><tspan dy="-3.64"> = 2000 W/K,  Q</tspan><tspan font-size="9.36" dy="3.64">max</tspan><tspan dy="-3.64"> = 10 kW</tspan></text>
<text x="170" y="147.96" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>T</tspan><tspan font-size="9.36" dy="3.64">set</tspan><tspan dy="-3.64"> = 22 °C / 16 °C (je halber Tag)</tspan></text>
<rect x="475" y="40" width="310" height="140" rx="4" fill="#fbeadc" stroke="#c0601a" stroke-width="1.2"/>
<text x="630" y="81.4" font-size="13" text-anchor="middle" fill="#1a1a1a" font-weight="bold"><tspan>Room</tspan></text>
<text x="630" y="98.04" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>Energiebilanz des Raums</tspan></text>
<text x="630" y="114.68" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>C·dT/dt = Q − k·(T − T</tspan><tspan font-size="9.36" dy="3.64">amb</tspan><tspan dy="-3.64">)</tspan></text>
<text x="630" y="131.32" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>C = 50 000 J/K,  k = 250 W/K</tspan></text>
<text x="630" y="147.96" font-size="13" text-anchor="middle" fill="#1a1a1a"><tspan>T</tspan><tspan font-size="9.36" dy="3.64">0</tspan><tspan dy="-3.64"> = 2 °C</tspan></text>
<path d="M325,75 L473,75" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="400" y="66" font-size="12" text-anchor="middle" fill="#1a1a1a"><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.04">heatingLoad</tspan><tspan>  Q [W]</tspan></text>
<path d="M475,145 L327,145" fill="none" stroke="#1a1a1a" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#arr-ink)"/>
<text x="400" y="136" font-size="12" text-anchor="middle" fill="#1a1a1a"><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.04">roomTemperature</tspan><tspan>  T [K]</tspan></text>
<path d="M630,235 L630,182" fill="none" stroke="#6b6b6b" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#arr-gray)"/>
<text x="620" y="232" font-size="12" text-anchor="end" fill="#6b6b6b"><tspan>T</tspan><tspan font-size="8.64" dy="3.36">amb</tspan><tspan dy="-3.36"> = 2 °C (konstant, nicht verbunden)</tspan></text>
<text x="15" y="205" font-size="12" text-anchor="start" fill="#6b6b6b"><tspan>T</tspan><tspan font-size="8.64" dy="3.36">est</tspan><tspan dy="-3.36">: aus der Eingangshistorie extrapolierte Raumtemperatur</tspan></text>
<text x="15" y="22" font-size="12" text-anchor="start" fill="#6b6b6b"><tspan>beide FMUs: </tspan><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.04">canInterpolateInputs="true"</tspan><tspan>, </tspan><tspan font-family="Liberation Mono, DejaVu Sans Mono, Consolas, monospace" font-size="11.04">maxOutputDerivativeOrder="1"</tspan></text>
</svg>
